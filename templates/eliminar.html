{% extends 'base.html' %}

{% block titulo %}Eliminar {{ g }}{% endblock %}

{% block contenido %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center">
  <h2>¿Eliminar la {{ g }}?</h2>
  <p class="sub" style="margin-top:8px">Se borrarán el audio y su archivo de texto. Esto no se puede deshacer.</p>
  <form method="post" class="botones" style="justify-content:center">
    {% csrf_token %}
    <button class="boton rojo" type="submit">Sí, eliminar</button>
    <a class="boton gris" href="{% url 'triage:detalle' g.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
