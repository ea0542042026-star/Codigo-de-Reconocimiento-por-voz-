{% extends 'triage/base.html' %}

{% block titulo %}Eliminar paciente{% endblock %}

{% block contenido %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center">
  <span class="ico p-ROJO" style="width:56px;height:56px;border-radius:50%;display:inline-grid;place-items:center;margin-bottom:14px">
    <svg class="icono" style="width:28px;height:28px"><use href="#i-alerta"/></svg>
  </span>
  <h2>¿Eliminar a {{ paciente }}?</h2>
  <p class="sub" style="margin-top:8px">También se borrarán sus {{ paciente.registros.count }} evaluaciones de triage. Esto no se puede deshacer.</p>
  <form method="post" class="botones" style="justify-content:center">
    {% csrf_token %}
    <button class="boton rojo" type="submit">Sí, eliminar</button>
    <a class="boton gris" href="{% url 'triage:paciente_detalle' paciente.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
